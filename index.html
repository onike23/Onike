<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONIKE SOCIAL 🔥</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:'Arial';height:100vh;display:flex}
.login{margin:auto;width:90%;max-width:400px;display:flex;flex-direction:column;gap:10px}
.chat{width:100%;display:flex;flex-direction:column}
  header{background:#00ff88;color:#000;padding:15px;font-weight:bold;text-align:center}
  #messages{flex:1;overflow-y:auto;padding:15px;background:#111}
.msg{background:#1f1f1f;padding:10px;margin:8px 0;border-radius:10px}
.msg.me{background:#00ff88;color:#000;margin-left:50px}
.input-area{display:flex;padding:10px;background:#1a1a1a;gap:8px}
  input,button{padding:12px;border:none;border-radius:8px}
  input{flex:1;background:#2a2a2a;color:#fff}
  button{background:#00ff88;color:#000;font-weight:bold;cursor:pointer}
  #fileBtn{background:#333;color:#fff}
</style>
</head>
<body>

<div class="login" id="login">
  <h1 style="text-align:center;margin-bottom:10px">🔥 ONIKE SOCIAL</h1>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<div class="chat" id="chat" style="display:none">
  <header>ONIKE CHAT - <span id="userEmail"></span></header>
  <div id="messages"></div>
  <div class="input-area">
    <input id="msgInput" placeholder="Type message...">
    <input type="file" id="fileInput" style="display:none" accept="image/*,audio/*">
    <button id="fileBtn" onclick="fileInput.click()">📎</button>
    <button onclick="sendMsg()">Send</button>
    <button onclick="logout()">Exit</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// YOUR KEYS
const firebaseConfig = {
  apiKey: "AIzaSyAdMPWsGvffeQxb-cAwtVV5TYE-4K90UwA",
  authDomain: "onike-social.firebaseapp.com",
  databaseURL: "https://onike-social-default-rtdb.firebaseio.com",
  projectId: "onike-social",
  storageBucket: "onike-social.firebasestorage.app",
  messagingSenderId: "323489933218",
  appId: "1:323489933218:web:1dbd1ea45253ae9447b4fb"
};

const CLOUD_NAME = "vw7zeyin"; // YOUR CLOUDINARY NAME ✅
const UPLOAD_PRESET = "onike23"; // YOUR PRESET NAME ✅

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getDatabase();

onAuthStateChanged(auth, user => {
  if(user){ 
    login.style.display='none'; 
    chat.style.display='flex';
    userEmail.innerText = user.email;
    loadMsgs();
  }
});

window.register = () => createUserWithEmailAndPassword(auth, email.value, password.value).catch(e=>alert(e.message));
window.login = () => signInWithEmailAndPassword(auth, email.value, password.value).catch(e=>alert(e.message));
window.logout = () => signOut(auth).then(()=>location.reload());

function loadMsgs(){
  onChildAdded(ref(db, 'messages'), snap => {
    const d = snap.val();
    const isMe = d.uid === auth.currentUser.uid;
    let content = d.text || '';
    if(d.file) content += `<br><img src="${d.file}" style="max-width:200px;border-radius:8px;margin-top:5px">`;
    messages.innerHTML += `<div class="msg ${isMe?'me':''}"><b>${d.user}:</b><br>${content}</div>`;
    messages.scrollTop = messages.scrollHeight;
  });
}

async function uploadFile(file){
  const form = new FormData();
  form.append('file', file);
  form.append('upload_preset', UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, {method:'POST', body:form});
  return (await res.json()).secure_url;
}

fileInput.onchange = async e => {
  const file = e.target.files[0];
  if(!file) return;
  const url = await uploadFile(file);
  push(ref(db, 'messages'), { uid: auth.currentUser.uid, user: auth.currentUser.email, text: '', file: url });
}

window.sendMsg = () => {
  if(msgInput.value.trim() === '') return;
  push(ref(db, 'messages'), { uid: auth.currentUser.uid, user: auth.currentUser.email, text: msgInput.value });
  msgInput.value = '';
}
</script>
</body>
  </html>
