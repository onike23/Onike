<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OnikeUniverse</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
    body{background:#fff;color:#000;padding-bottom:80px}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #eee}
.btn-pill{padding:6px 14px;border-radius:8px;font-size:14px;border:0}
.btn-gray{background:#f2f2f2}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px;position:relative}
.logo-area{display:flex;align-items:center;gap:8px}
.logo-img{width:32px;height:32px;border-radius:8px;object-fit:cover}
.brand{font-size:18px;font-weight:700}
.page{padding:0 16px}
.hidden{display:none}
    /* DROPDOWN MENU */
.dropdown{position:absolute;right:16px;top:60px;width:220px;background:#fff;border:1px solid #eee;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:30}
.dropdown p{padding:10px 16px;font-size:12px;color:#888;font-weight:600}
.dropdown button{width:100%;text-align:left;padding:12px 16px;border:0;background:0;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.dropdown button:hover{background:#f5f5f5}
.dropdown.logout{color:red;border-top:1px solid #eee}
    /* HOMEPAGE CIRCLES */
.circle-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}
.circle-btn{text-align:center;border:1px solid #eee;border-radius:12px;padding:20px 10px;cursor:pointer;transition:.2s}
.circle-btn:hover{background:#f9f9f9}
.circle-icon{width:40px;height:40px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:20px}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.page h2{font-size:28px;font-weight:800}
.page p.sub{color:#888;font-size:14px}
.btn-black{background:#000;color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;border:0;cursor:pointer}
    /* LIST ITEMS */
.user-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f5f5f5;cursor:pointer}
.avatar{width:40px;height:40px;border-radius:50%;background:#ddd}
    /* SETTINGS */
.settings-list{border:1px solid #eee;border-radius:12px;overflow:hidden;margin-top:12px}
.settings-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer}
.settings-title{font-size:12px;color:#888;text-transform:uppercase;margin:20px 0 8px;font-weight:700}
